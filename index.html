<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katica Hegyi — Architecture Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#cfcdc8;
      --sheet:#e0e0e0;
      --ink:#1a1a17;
      --muted:#6c6a64;
      --faint:#9b9890;
      --line:rgba(20,20,16,.14);
      --line-strong:rgba(20,20,16,.30);
      --glass:rgba(224,224,224,.74);
      --ease:cubic-bezier(.22,.61,.36,1);
      --pad:clamp(22px,4.2vw,72px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:'Montserrat', system-ui, sans-serif;
      font-optical-sizing:auto;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow:hidden;
    }

    button{
      font-family:inherit; color:inherit;
      background:none; border:0; cursor:pointer;
      letter-spacing:inherit;
    }
    :focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

    .app{ height:100vh; width:100vw; position:relative; }

    /* ───────── HOME ───────── */
    .home{
      height:100%; overflow-y:auto;
      padding:clamp(34px,5vw,64px) var(--pad) 0;
      transition:opacity .5s var(--ease), transform .5s var(--ease);
    }
    .home.hidden{
      opacity:0; transform:scale(.99);
      pointer-events:none; position:absolute; inset:0;
    }

    .masthead{
      display:flex; align-items:flex-end;
      padding-bottom:22px;
      margin-bottom:clamp(34px,5vw,52px);
      border-bottom:1px solid var(--line-strong);
    }
    .masthead h1{
      margin:0;
      font-weight:600;            /* Montserrat SemiBold */
      font-size:clamp(30px,6vw,76px);
      line-height:.92;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .masthead .role{
      display:block;
      margin-top:14px;
      font-size:clamp(10px,1vw,12px);
      font-weight:500;
      letter-spacing:.3em;
      text-transform:uppercase;
      color:var(--muted);
    }

    /* ───────── GRID ───────── */
    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:clamp(20px,2.6vw,38px);
      padding-bottom:clamp(40px,6vw,80px);
    }
    .card{
      width:100%; text-align:left;
      display:flex; flex-direction:column;
      opacity:0; transform:translateY(14px);
      animation:rise .7s var(--ease) forwards;
    }
    @keyframes rise{ to{ opacity:1; transform:none; } }

    .frame{
      position:relative;
      aspect-ratio:2382/1684;
      background:var(--sheet);
      border:1px solid var(--line);
      overflow:hidden;
      transition:border-color .4s var(--ease), box-shadow .4s var(--ease);
    }
    .thumb{
      width:100%; height:100%;
      object-fit:contain;
      filter:grayscale(1) contrast(.98);
      opacity:.92;
      transition:filter .5s var(--ease), opacity .5s var(--ease), transform .7s var(--ease);
    }
    .frame::after{
      content:"View";
      position:absolute; left:14px; bottom:12px;
      font-size:10px; font-weight:600;
      letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink);
      opacity:0; transform:translateY(6px);
      transition:opacity .4s var(--ease), transform .4s var(--ease);
    }
    .card:hover .frame, .card:focus-visible .frame{
      border-color:var(--line-strong);
      box-shadow:0 26px 60px rgba(0,0,0,.16);
    }
    .card:hover .thumb, .card:focus-visible .thumb{
      filter:grayscale(0) contrast(1);
      opacity:1; transform:scale(1.012);
    }
    .card:hover .frame::after, .card:focus-visible .frame::after{
      opacity:1; transform:none;
    }
    .card-meta{
      display:flex; justify-content:space-between; gap:12px;
      margin-top:13px;
      font-size:10.5px; font-weight:500;
      letter-spacing:.22em; text-transform:uppercase;
      color:var(--faint);
    }
    .card-meta b{ font-weight:600; color:var(--ink); }

    /* ───────── FOOTER ───────── */
    .colophon{
      display:flex; justify-content:space-between; align-items:baseline;
      gap:24px; flex-wrap:wrap;
      padding:22px 0 40px;
      border-top:1px solid var(--line);
      font-size:11px; font-weight:500;
      letter-spacing:.16em; text-transform:uppercase;
      color:var(--faint);
    }
    .colophon a{ color:var(--ink); text-decoration:none; }
    .colophon a:hover{ text-decoration:underline; text-underline-offset:3px; }

    /* ───────── VIEWER ───────── */
    .viewer{
      position:absolute; inset:0;
      background:var(--bg);
      display:none; opacity:0;
      transition:opacity .4s var(--ease);
    }
    .viewer.active{ display:block; opacity:1; }

    .stage{
      height:100%;
      display:grid;
      grid-template-columns:clamp(260px,24vw,320px) 1fr;
    }
    .side{
      border-right:1px solid var(--line-strong);
      padding:clamp(26px,3vw,40px);
      display:flex; flex-direction:column; justify-content:space-between;
      background:var(--glass);
      backdrop-filter:blur(14px);
    }
    .back{
      align-self:flex-start;
      padding:9px 16px 9px 12px;
      border:1px solid var(--line-strong);
      border-radius:999px;
      font-size:11px; font-weight:500;
      letter-spacing:.16em; text-transform:uppercase;
      transition:background .3s var(--ease);
    }
    .back:hover{ background:rgba(0,0,0,.05); }

    .side .num{ margin-top:34px; font-size:11px; font-weight:600; letter-spacing:.24em; color:var(--faint); }
    .side h3{ margin:10px 0 0; font-weight:500; font-size:clamp(18px,2vw,23px); line-height:1.14; letter-spacing:.01em; }
    .side .yr{ margin-top:9px; font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }

    .side-foot{ display:flex; flex-direction:column; gap:16px; }
    .counter{ font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .progress{ height:1px; background:var(--line-strong); position:relative; }
    .progress span{ position:absolute; left:0; top:0; bottom:0; background:var(--ink); transition:width .35s var(--ease); }
    .proj-nav{ display:flex; justify-content:space-between; gap:12px; font-size:10.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; }
    .proj-nav button{ color:var(--muted); transition:color .3s var(--ease); }
    .proj-nav button:hover:not(:disabled){ color:var(--ink); }
    .proj-nav button:disabled{ opacity:.3; cursor:default; }

    .canvas{
      position:relative;
      display:flex; align-items:center; justify-content:center;
      padding:clamp(28px,4vw,56px) clamp(64px,7vw,108px);
    }
    .pageImg{
      max-width:100%; max-height:90vh;
      object-fit:contain;
      background:#fff;
      box-shadow:0 30px 90px rgba(0,0,0,.2);
      cursor:pointer;
      transition:opacity .22s var(--ease), transform .26s var(--ease);
      will-change:opacity,transform;
    }
    .pageImg.switching{ opacity:0; transform:scale(.992); }

    /* plain chevrons — no circle, larger */
    .nav{
      position:absolute; top:50%;
      transform:translateY(-50%);
      width:60px; height:80px;
      display:flex; align-items:center; justify-content:center;
      font-size:72px; font-weight:300; line-height:0;
      color:var(--ink);
      opacity:.5;
      transition:opacity .25s var(--ease);
    }
    .nav:hover:not(:disabled){ opacity:1; }
    .nav:disabled{ opacity:.15; cursor:default; }
    .prev{ left:clamp(10px,1.6vw,26px); }
    .next{ right:clamp(10px,1.6vw,26px); }

    /* ───────── RESPONSIVE ───────── */
    @media(max-width:1100px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

    @media(max-width:760px){
      body{ overflow:auto; }
      .app{ height:auto; }
      .home{ height:auto; overflow:visible; padding:30px 18px 0; }
      .home.hidden{ position:fixed; }
      .masthead h1{ font-size:38px; letter-spacing:.06em; }
      .grid{ grid-template-columns:1fr; gap:26px; }
      .frame::after{ opacity:1; transform:none; }
      .thumb{ filter:grayscale(0); opacity:1; }

      .stage{ grid-template-columns:1fr; }
      .side{
        position:absolute; z-index:3;
        top:14px; left:14px; right:14px;
        border:1px solid var(--line-strong);
        border-radius:16px; padding:14px 16px;
        flex-direction:row; align-items:center; justify-content:space-between;
      }
      .side .num,.side h3,.side .yr{ display:none; }
      .side-foot{ flex-direction:row; align-items:center; gap:14px; }
      .progress{ display:none; }
      .proj-nav{ display:none; }
      .canvas{ height:100vh; padding:96px 8px 84px; }
      .pageImg{ max-height:80vh; }
      .nav{ top:auto; bottom:14px; transform:none; height:60px; font-size:60px; opacity:.7; }
      .prev{ left:calc(50% - 70px); }
      .next{ right:calc(50% - 70px); }
    }

    @media(prefers-reduced-motion:reduce){
      *{ animation:none !important; transition:none !important; }
      .card{ opacity:1; transform:none; }
    }
  </style>
</head>

<body>
<div class="app">

  <main class="home" id="home">
    <div class="masthead">
      <div>
        <h1>Katica&nbsp;Hegyi</h1>
        <span class="role">Architecture · Selected Works</span>
      </div>
    </div>

    <section class="grid" id="grid"></section>

    <footer class="colophon">
      <span>Katica Hegyi — Portfolio</span>
      <span>Contact · <a href="mailto:hegyikatica@gmail.com">hegyikatica@gmail.com</a></span>
    </footer>
  </main>

  <section class="viewer" id="viewer" aria-live="polite">
    <div class="stage">
      <aside class="side">
        <div>
          <button class="back" onclick="goHome()">← Index</button>
          <div class="num" id="projectNum"></div>
          <h3 id="projectTitle"></h3>
          <div class="yr" id="projectYear"></div>
        </div>
        <div class="side-foot">
          <div class="counter" id="counter"></div>
          <div class="progress"><span id="progressBar"></span></div>
          <div class="proj-nav">
            <button id="prevProj" onclick="moveProject(-1)">← Prev work</button>
            <button id="nextProj" onclick="moveProject(1)">Next work →</button>
          </div>
        </div>
      </aside>

      <div class="canvas">
        <button class="nav prev" id="prev" aria-label="Previous page" onclick="move(-1)">‹</button>
        <img class="pageImg" id="pageImg" alt="Portfolio page" decoding="async" onclick="move(1)">
        <button class="nav next" id="next" aria-label="Next page" onclick="move(1)">›</button>
      </div>
    </div>
  </section>

</div>

<script>
const projects = [
  { title:'Shelter in Paraguay', year:'2022–23', pages:[4,5,6,7], cover:4 },
  { title:'Pigeon Meat Processing Manufactory', year:'2022–23', pages:[8,9,10,11,12,13], cover:8 },
  { title:'Live Music Concert Hall and Street Food at Rákosrendező', year:'2023', pages:[14,15,16,17,18,19], cover:14 },
  { title:'Multi-Purpose Sports Hall in the Orczy Quarter', year:'2024', pages:[20,21,22,23], cover:20 },
  { title:'Butterfly House in the Mecsek', year:'Thesis', pages:[24,25,26,27,28,29], cover:24 },
  { title:'Branching from the In-Between', year:'Studio II', pages:[30,31,32,33], cover:30 }
];

let currentProject = 0, currentPage = 0;

function pageSources(n){
  const pad = String(n).padStart(2,'0');
  const exts = ['jpg','jpeg','png','webp'];
  const out = [];
  exts.forEach(e => out.push(`pages/page_${pad}.${e}`));
  exts.forEach(e => out.push(`pages/page${n}.${e}`));
  exts.forEach(e => out.push(`page_${pad}.${e}`));
  exts.forEach(e => out.push(`page${n}.${e}`));
  return out;
}
function coverSources(n){
  const pad = String(n).padStart(2,'0');
  return [`pages/thumbs/page_${pad}.jpg`, ...pageSources(n)]; // small thumb first, full as fallback
}

function setImageWithFallback(image, sources, altText){
  let i = 0;
  image.alt = altText;
  image.onload = () => image.classList.remove('switching');
  image.onerror = () => {
    i += 1;
    if(i < sources.length){ image.src = sources[i]; }
    else { image.onerror = image.onload = null; image.classList.remove('switching'); console.error('Image not found. Tried:', sources); }
  };
  image.classList.add('switching');
  image.src = sources[i];
}

const grid = document.getElementById('grid');
projects.forEach((p,i)=>{
  const card = document.createElement('button');
  card.className = 'card';
  card.style.animationDelay = (i*70)+'ms';
  card.setAttribute('aria-label', `Open ${p.title}`);
  card.onclick = () => openProject(i);
  card.innerHTML = `
    <div class="frame"><img class="thumb" loading="lazy" decoding="async" alt="${p.title}"></div>
    <div class="card-meta"><b>${String(i+1).padStart(2,'0')}</b><span>${p.year}</span></div>
  `;
  grid.appendChild(card);
  setImageWithFallback(card.querySelector('.thumb'), coverSources(p.cover), p.title);
});

function preloadPage(n){ const im = new Image(); im.src = pageSources(n)[0]; }

function openProject(i){
  currentProject = i; currentPage = 0;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('viewer').classList.add('active');
  renderPage();
}
function goHome(){
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('home').classList.remove('hidden');
}

function renderPage(){
  const p = projects[currentProject];
  const page = p.pages[currentPage];
  setImageWithFallback(document.getElementById('pageImg'), pageSources(page), `${p.title}, page ${currentPage+1}`);

  document.getElementById('projectNum').textContent = String(currentProject+1).padStart(2,'0') + ' / ' + String(projects.length).padStart(2,'0');
  document.getElementById('projectTitle').textContent = p.title;
  document.getElementById('projectYear').textContent = p.year;
  document.getElementById('counter').textContent = `Page ${currentPage+1} of ${p.pages.length}`;
  document.getElementById('progressBar').style.width = ((currentPage+1)/p.pages.length*100) + '%';

  document.getElementById('prev').disabled = currentPage === 0;
  document.getElementById('next').disabled = currentPage === p.pages.length - 1;
  document.getElementById('prevProj').disabled = currentProject === 0;
  document.getElementById('nextProj').disabled = currentProject === projects.length - 1;

  // quietly preload the neighbouring pages for snappy paging
  if(currentPage+1 < p.pages.length) preloadPage(p.pages[currentPage+1]);
  if(currentPage-1 >= 0) preloadPage(p.pages[currentPage-1]);
}

function move(d){
  const p = projects[currentProject];
  currentPage = Math.max(0, Math.min(p.pages.length - 1, currentPage + d));
  renderPage();
}
function moveProject(d){
  const next = currentProject + d;
  if(next < 0 || next >= projects.length) return;
  currentProject = next; currentPage = 0; renderPage();
}

document.addEventListener('keydown', e => {
  if(!document.getElementById('viewer').classList.contains('active')) return;
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft') move(-1);
  if(e.key === 'Escape') goHome();
});

let touchX = null;
const canvas = document.querySelector('.canvas');
canvas.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
canvas.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 45) move(dx < 0 ? 1 : -1);
  touchX = null;
}, {passive:true});
</script>

</body>
</html>
