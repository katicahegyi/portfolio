<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katica Hegyi — Architecture Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#cfcdc8;
      --sheet:#e0e0e0;
      --ink:#1a1a17;
      --muted:#6c6a64;
      --faint:#9b9890;
      --line:rgba(20,20,16,.14);
      --line-strong:rgba(20,20,16,.30);
      --glass:rgba(224,224,224,.74);
      --ease:cubic-bezier(.22,.61,.36,1);
      --pad:clamp(22px,4.2vw,72px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:'Montserrat', system-ui, sans-serif;
      font-optical-sizing:auto; -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility; overflow:hidden;
    }
    button{ font-family:inherit; color:inherit; background:none; border:0; cursor:pointer; letter-spacing:inherit; }
    :focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
    .app{ height:100vh; width:100vw; position:relative; }

    /* HOME */
    .home{
      height:100%; overflow-y:auto;
      padding:clamp(34px,5vw,64px) var(--pad) clamp(40px,6vw,80px);
      transition:opacity .5s var(--ease), transform .5s var(--ease);
    }
    .home.hidden{ opacity:0; transform:scale(.99); pointer-events:none; position:absolute; inset:0; }

    .masthead{
      display:flex; justify-content:space-between; align-items:flex-end;
      padding-bottom:22px; margin-bottom:clamp(34px,5vw,52px);
      border-bottom:1px solid var(--line-strong);
    }
    .masthead h1{
      margin:0; font-weight:600;
      font-size:clamp(30px,6vw,76px); line-height:.92;
      letter-spacing:.1em; text-transform:uppercase;
    }
    .masthead .role{
      display:block; margin-top:14px;
      font-size:clamp(10px,1vw,12px); font-weight:500;
      letter-spacing:.3em; text-transform:uppercase; color:var(--muted);
    }
    .eyebrow{
      flex-shrink:0;
      font-size:11px; font-weight:600;
      letter-spacing:.3em; text-transform:uppercase; color:var(--faint);
    }

    /* GRID */
    .grid{
      display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
      gap:clamp(20px,2.6vw,38px);
    }
    .card{
      width:100%; text-align:left; display:flex; flex-direction:column;
      opacity:0; transform:translateY(14px); animation:rise .7s var(--ease) forwards;
    }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    .frame{
      position:relative; aspect-ratio:2382/1684;
      background:var(--sheet); border:1px solid var(--line); overflow:hidden;
      transition:border-color .4s var(--ease), box-shadow .4s var(--ease);
    }
    .thumb{
      width:100%; height:100%; object-fit:contain;
      filter:grayscale(1) contrast(.98); opacity:.92;
      transition:filter .5s var(--ease), opacity .5s var(--ease), transform .7s var(--ease);
    }
    .frame::after{
      content:"View"; position:absolute; left:14px; bottom:12px;
      font-size:10px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink); opacity:0; transform:translateY(6px);
      transition:opacity .4s var(--ease), transform .4s var(--ease);
    }
    .card:hover .frame,.card:focus-visible .frame{ border-color:var(--line-strong); box-shadow:0 26px 60px rgba(0,0,0,.16); }
    .card:hover .thumb,.card:focus-visible .thumb{ filter:grayscale(0) contrast(1); opacity:1; transform:scale(1.012); }
    .card:hover .frame::after,.card:focus-visible .frame::after{ opacity:1; transform:none; }
    .card-meta{
      margin-top:13px;
      font-size:10.5px; font-weight:600; letter-spacing:.22em; color:var(--ink);
    }

    .colophon{
      display:flex; justify-content:space-between; align-items:baseline; gap:24px; flex-wrap:wrap;
      margin-top:clamp(40px,6vw,72px);
      padding:22px 0 8px; border-top:1px solid var(--line);
      font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
    }
    .colophon a{ color:var(--ink); text-decoration:none; }
    .colophon a:hover{ text-decoration:underline; text-underline-offset:3px; }

    /* VIEWER */
    .viewer{ position:absolute; inset:0; background:var(--bg); display:none; opacity:0; transition:opacity .4s var(--ease); }
    .viewer.active{ display:block; opacity:1; }
    .stage{ height:100%; display:grid; grid-template-columns:clamp(260px,24vw,320px) 1fr; }
    .side{
      border-right:1px solid var(--line-strong); padding:clamp(26px,3vw,40px);
      display:flex; flex-direction:column; justify-content:space-between;
      background:var(--glass); backdrop-filter:blur(14px); z-index:4;
    }
    .back{
      align-self:flex-start; padding:9px 16px 9px 12px;
      border:1px solid var(--line-strong); border-radius:999px;
      font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
      transition:background .3s var(--ease);
    }
    .back:hover{ background:rgba(0,0,0,.05); }
    .side .num{ margin-top:34px; font-size:11px; font-weight:600; letter-spacing:.24em; color:var(--faint); }
    .side h3{ margin:10px 0 0; font-weight:500; font-size:clamp(18px,2vw,23px); line-height:1.14; letter-spacing:.01em; }
    .side .yr{ margin-top:9px; font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .side-foot{ display:flex; flex-direction:column; gap:16px; }
    .counter{ font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .progress{ height:1px; background:var(--line-strong); position:relative; }
    .progress span{ position:absolute; left:0; top:0; bottom:0; background:var(--ink); transition:width .35s var(--ease); }
    .proj-nav{ display:flex; justify-content:space-between; gap:12px; font-size:10.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; }
    .proj-nav button{ color:var(--muted); transition:color .3s var(--ease); }
    .proj-nav button:hover:not(:disabled){ color:var(--ink); }
    .proj-nav button:disabled{ opacity:.3; cursor:default; }

    /* peek carousel */
    .canvas{ position:relative; overflow:hidden; }
    .track{
      position:absolute; inset:0;
      display:flex; align-items:center;
      transition:transform .42s var(--ease);
      will-change:transform;
    }
    .slide{
      flex:0 0 auto; height:100%;
      display:flex; align-items:center; justify-content:center;
      opacity:.4; transition:opacity .42s var(--ease);
    }
    .slide.current{ opacity:1; }
    .slide img{
      display:block; width:100%;
      max-height:86vh;
      aspect-ratio:2382/1684; object-fit:contain;
      background:var(--sheet) center/contain no-repeat;
      box-shadow:0 26px 80px rgba(0,0,0,.2);
      cursor:pointer;
    }

    .nav{
      position:absolute; top:50%; transform:translateY(-50%); z-index:3;
      width:60px; height:80px; display:flex; align-items:center; justify-content:center;
      font-size:72px; font-weight:300; line-height:0; color:var(--ink);
      opacity:.5; transition:opacity .25s var(--ease);
    }
    .nav:hover:not(:disabled){ opacity:1; }
    .nav:disabled{ opacity:.15; cursor:default; }
    .prev{ left:clamp(10px,1.4vw,22px); }
    .next{ right:clamp(10px,1.4vw,22px); }

    @media(max-width:1100px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:760px){
      body{ overflow:auto; } .app{ height:auto; }
      .home{ height:auto; overflow:visible; padding:30px 18px 50px; }
      .home.hidden{ position:fixed; }
      .masthead h1{ font-size:38px; letter-spacing:.06em; }
      .grid{ grid-template-columns:1fr; gap:26px; }
      .frame::after{ opacity:1; transform:none; }
      .thumb{ filter:grayscale(0); opacity:1; }
      .stage{ grid-template-columns:1fr; }
      .side{
        position:absolute; z-index:4; top:14px; left:14px; right:14px;
        border:1px solid var(--line-strong); border-radius:16px; padding:14px 16px;
        flex-direction:row; align-items:center; justify-content:space-between;
        background:rgba(224,224,224,.9);
      }
      .side .num,.side h3,.side .yr{ display:none; }
      .side-foot{ flex-direction:row; align-items:center; gap:14px; }
      .progress{ display:none; } .proj-nav{ display:none; }
      .slide img{ max-height:74vh; }
      .nav{ top:auto; bottom:14px; transform:none; height:60px; font-size:60px; opacity:.7; }
      .prev{ left:calc(50% - 70px); } .next{ right:calc(50% - 70px); }
    }
    @media(prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } .card{ opacity:1; transform:none; } }
  </style>
</head>

<body>
<div class="app">

  <main class="home" id="home">
    <div class="masthead">
      <div>
        <h1>Katica&nbsp;Hegyi</h1>
        <span class="role">Architecture · Selected Works</span>
      </div>
      <span class="eyebrow">Index</span>
    </div>
    <section class="grid" id="grid"></section>
    <footer class="colophon">
      <span>Katica Hegyi — Portfolio</span>
      <span>Contact · <a href="mailto:hegyikatica@gmail.com">hegyikatica@gmail.com</a></span>
    </footer>
  </main>

  <section class="viewer" id="viewer" aria-live="polite">
    <div class="stage">
      <aside class="side">
        <div>
          <button class="back" onclick="goHome()">← Index</button>
          <div class="num" id="projectNum"></div>
          <h3 id="projectTitle"></h3>
          <div class="yr" id="projectYear"></div>
        </div>
        <div class="side-foot">
          <div class="counter" id="counter"></div>
          <div class="progress"><span id="progressBar"></span></div>
          <div class="proj-nav">
            <button id="prevProj" onclick="moveProject(-1)">← Prev work</button>
            <button id="nextProj" onclick="moveProject(1)">Next work →</button>
          </div>
        </div>
      </aside>
      <div class="canvas" id="canvas">
        <button class="nav prev" id="prev" aria-label="Previous page" onclick="move(-1)">‹</button>
        <div class="track" id="track"></div>
        <button class="nav next" id="next" aria-label="Next page" onclick="move(1)">›</button>
      </div>
    </div>
  </section>

</div>

const projects = [
  { title:'Shelter in Paraguay', year:'2022–23', pages:[4,5,6,7], cover:4 },
  { title:'Pigeon Meat Processing Manufactory', year:'2022–23', pages:[8,9,10,11,12,13], cover:8 },
  { title:'Live Music Concert Hall and Street Food at Rákosrendező', year:'2023', pages:[14,15,16,17,18,19], cover:14 },
  { title:'Multi-Purpose Sports Hall in the Orczy Quarter', year:'2024', pages:[20,21,22,23], cover:20 },
  { title:'Butterfly House in the Mecsek', year:'Thesis', pages:[24,25,26,27,28,29], cover:24 },
  { title:'Branching from the In-Between', year:'Studio II', pages:[30,31,32,33,34], cover:30 }
];

let currentProject = 0;
let currentPage = 0;

const canvas = document.getElementById('canvas');
const track = document.getElementById('track');
const grid = document.getElementById('grid');

const imageCache = new Map();

function pageSrc(n){
  return `page_${String(n).padStart(2,'0')}.jpg`;
}
  
function preloadPage(n){
  const src = pageSrc(n);
  if(imageCache.has(src)) return imageCache.get(src);

  const img = new Image();
  img.decoding = 'async';
  img.loading = 'eager';
  img.src = src;

  imageCache.set(src, img);
  return img;
}

function preloadAllPages(){
  for(let i = 1; i <= 34; i++){
    preloadPage(i);
  }
}

preloadAllPages();

/* HOME GRID */
projects.forEach((p,i)=>{
  const card = document.createElement('button');
  card.className = 'card';
  card.style.animationDelay = `${i * 60}ms`;
  card.setAttribute('aria-label', `Open ${p.title}`);
  card.onclick = () => openProject(i);

  card.innerHTML = `
    <div class="frame">
      <img class="thumb" decoding="async" loading="eager" alt="${p.title}">
    </div>
    <div class="card-meta">${String(i+1).padStart(2,'0')}</div>
  `;

  grid.appendChild(card);

  const thumb = card.querySelector('.thumb');
  thumb.src =
    typeof COVERS !== 'undefined' && COVERS[p.cover]
      ? COVERS[p.cover]
      : pageSrc(p.cover);
});

/* VIEWER */
function openProject(i){
  currentProject = i;
  currentPage = 0;

  projects[i].pages.forEach(preloadPage);

  buildTrack();

  document.getElementById('home').classList.add('hidden');
  document.getElementById('viewer').classList.add('active');

  requestAnimationFrame(render);
}

function goHome(){
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('home').classList.remove('hidden');
}

function buildTrack(){
  const p = projects[currentProject];

  track.innerHTML = p.pages.map((n,idx)=>`
    <div class="slide" data-idx="${idx}">
      <img
        src="${pageSrc(n)}"
        decoding="async"
        loading="eager"
        alt="${p.title}, page ${idx + 1}">
    </div>
  `).join('');
}

function layout(){
  const cw = canvas.clientWidth;
  const sw = Math.round(cw * 0.80);
  const gap = Math.round(cw * 0.045);
  const leftPad = Math.round(cw * 0.05);

  [...track.children].forEach(slide=>{
    slide.style.width = `${sw}px`;
  });

  track.style.gap = `${gap}px`;
  track.style.transform = `translateX(${leftPad - currentPage * (sw + gap)}px)`;
}

function render(){
  const p = projects[currentProject];

  [...track.children].forEach((slide,idx)=>{
    slide.classList.toggle('current', idx === currentPage);
  });

  layout();

  document.getElementById('projectNum').textContent =
    `${String(currentProject + 1).padStart(2,'0')} / ${String(projects.length).padStart(2,'0')}`;

  document.getElementById('projectTitle').textContent = p.title;
  document.getElementById('projectYear').textContent = p.year;
  document.getElementById('counter').textContent =
    `Page ${currentPage + 1} of ${p.pages.length}`;

  document.getElementById('progressBar').style.width =
    `${((currentPage + 1) / p.pages.length) * 100}%`;

  document.getElementById('prev').disabled = currentPage === 0;
  document.getElementById('next').disabled = currentPage === p.pages.length - 1;
  document.getElementById('prevProj').disabled = currentProject === 0;
  document.getElementById('nextProj').disabled = currentProject === projects.length - 1;
}

function move(d){
  const p = projects[currentProject];
  const nextPage = Math.max(0, Math.min(p.pages.length - 1, currentPage + d));

  if(nextPage === currentPage) return;

  currentPage = nextPage;
  render();

  const upcoming = p.pages[currentPage + d];
  if(upcoming) preloadPage(upcoming);
}

function moveProject(d){
  const nextProject = currentProject + d;

  if(nextProject < 0 || nextProject >= projects.length) return;

  currentProject = nextProject;
  currentPage = 0;

  projects[currentProject].pages.forEach(preloadPage);

  buildTrack();
  render();
}

canvas.addEventListener('click', e=>{
  const slide = e.target.closest('.slide');
  if(!slide) return;

  const idx = Number(slide.dataset.idx);

  if(idx === currentPage){
    move(1);
  } else {
    currentPage = idx;
    render();
  }
});

document.addEventListener('keydown', e=>{
  if(!document.getElementById('viewer').classList.contains('active')) return;

  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft') move(-1);
  if(e.key === 'Escape') goHome();
});

let touchX = null;

canvas.addEventListener('touchstart', e=>{
  touchX = e.changedTouches[0].clientX;
}, { passive:true });

canvas.addEventListener('touchend', e=>{
  if(touchX === null) return;

  const dx = e.changedTouches[0].clientX - touchX;

  if(Math.abs(dx) > 45){
    move(dx < 0 ? 1 : -1);
  }

  touchX = null;
}, { passive:true });

window.addEventListener('resize', ()=>{
  if(document.getElementById('viewer').classList.contains('active')){
    layout();
  }
});
</script>

</body>
</html>
